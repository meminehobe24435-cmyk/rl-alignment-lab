[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-alignment-lab"
version = "0.1.0"
description = "零依赖（仅 numpy）手写 PPO / GRPO 的可验证奖励强化学习闭环"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "meminehobe24435-cmyk" }]
# 核心运行只依赖 numpy —— 没有 torch / jax / tensorflow / gym / trl / ray。
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=7.0"]

[project.scripts]
rl = "rlalign.cli:main"

[tool.setuptools]
packages = ["rlalign"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 注意：这里**不能**放 "-q"。CI 与本地都会再传一个 -q，
# 两个 -q 叠加成 -qq 会把 "N passed in Xs" 这一行汇总直接吞掉，
# 日志里只剩进度点，排查时很难确认到底跑了多少用例。
addopts = "--strict-markers --strict-config"
filterwarnings = ["error::RuntimeWarning"]
